serial_number: a200-0000
version: 0
system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000
platform:
  controller: ps4
  attachments:
    - name: front_bumper
      type: a200.bumper
      model: default
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      model: default
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
      model: default
      parent: default_mount
links: {}
mounts: {}
sensors:
  lidar2d:
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_link
      xyz: [0.35, 0.0, 0.1]
      rpy: [0.0, 0.0, 0.0]
